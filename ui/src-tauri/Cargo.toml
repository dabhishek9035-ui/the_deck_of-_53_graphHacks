[package]
name = "tutor-pet"
version = "0.1.0"
description = "Socratic Code-Tutor Pet: desktop pet + dashboard"
edition = "2021"

[lib]
name = "tutor_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.5"

[profile.release]
opt-level = "s"
lto = false
strip = true
